# Day settings: one file per experiment day, at <day folder>/setup/experiment_settings.yaml.
# Cell 0 of the notebooks creates and edits this file; it can also be edited by hand.
# Relative paths are resolved from the day folder. Videos are found in Top/ and Front/ by trial number.
# Values not listed here use the defaults in main_code/settings.py.

# ============================================================
# [Day] Set once per experiment day (cell 0 form)
# ============================================================
water:
  surface_z_cm: 67.0                            # water height above the floor (ID0 marker plane) [cm]

inputs:
  calib_top_npz: "setup/manual_calib_top.npz"   # written by 01_calibration, read by 02 and 03
  calib_front_npz: "setup/manual_calib_front.npz"
  top_weights: "setup/top_best.pt"
  front_weights: "setup/front_best.pt"

outputs:
  output_root: "result"                         # results: raw_N, final_N, video_N, setup_N, config.yaml

sync:
  top_time_offset_sec: 0.0                      # 0 for frame-aligned videos
  front_time_offset_sec: 0.0


# ============================================================
# [Calibration] Used by 01_calibration only
# ============================================================
calibration:
  top_video: "setup/top_calib.mp4"              # marker video of the top camera
  front_video: "setup/front_calib.mp4"          # marker video of the front camera
  frame_index: 0                                # frame where the marker is clearly visible
  front_use_wall_transform: false               # true: front camera sees the wall marker, not the floor marker
  front_pick_rightmost: true                    # use the rightmost marker if two are visible


# ============================================================
# [Equipment] Change only when cameras, tank, markers, or gripper change
# ============================================================
cameras:
  top:
    model: "GoPro HERO13 Black"
    K: [[1041.57146, 0.0, 949.734448],
        [0.0, 1047.97285, 551.602202],
        [0.0, 0.0, 1.0]]
    dist: [0.03618997, -0.04817693, -0.00320361, -0.00075223, 0.02632374]
  front:
    model: "Insta360 Ace Pro 2"
    K: [[734.42834248, 0.0, 958.12885964],
        [0.0, 738.92389777, 536.16766245],
        [0.0, 0.0, 1.0]]
    dist: [1.51047198e-02, -8.55712758e-03, -1.38100761e-03, 1.74587731e-05, 5.72933769e-03]

setup:
  marker_size_cm: 15.0                          # ArUco marker side (DICT_4X4_50) [cm]
  motor_center_in_id0_cm: [-26.5, 28.0, 17.1]   # gripper (motor) center in ID0 coordinates = output origin [cm]
  front_wall_y_cm: -11.6                        # front wall (refraction plane) Y [cm]
  front_wall_marker_R: [[1, 0, 0],              # wall marker frame -> world, used only if front_use_wall_transform
                        [0, 0, 1],
                        [0, -1, 0]]
  front_wall_marker_t: [52.0, -15.5, -10.0]

models:
  target_class_names: ["whitecube"]             # YOLO class name (case, space, underscore ignored)

video:
  expected_resolution: [1920, 1080]             # stop if different
  expected_fps: 59.94                           # reference timeline for frame-based constants
  save_annotated_video: true                    # false makes preprocessing faster


# ============================================================
# [Modify with caution] Algorithm constants
# Names from section [C] of main_code/settings.py. Changing them changes the results.
# Example:
#   RAY_GAP_MAX_CM: 7.0
#   GRAB_MIN: 60
# ============================================================
advanced: {}
